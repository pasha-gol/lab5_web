<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Green Corner</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
  nav a { margin-right: 15px; }
  .item { display: inline-block; width: 220px; vertical-align: top; margin: 10px; border: 1px solid #ccc; padding: 10px; }
  .item img { width: 200px; height: 200px; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="#" onclick="showCatalog(); return false;">Catalog</a>
</nav>
<hr>

<div id="content"></div>

<script>
const content = document.getElementById("content");

// Завантажує JSON; при помилці показує її на сторінці
function loadJSON(url) {
  return fetch(url).then(response => {
    if (!response.ok) throw new Error("Не знайдено файл " + url + " (код " + response.status + ")");
    return response.json();
  });
}

function showError(err) {
  content.innerHTML = "<p style='color:red'>Помилка: " + err.message + "</p>";
}

// Показує перелік категорій
function showCatalog(isHome) {
  loadJSON("data/categories.json")
    .then(categories => {
      let html = isHome
        ? "<h1>Ласкаво просимо до Green Corner</h1><p>Оберіть категорію:</p><ul>"
        : "<h1>Каталог</h1><ul>";
      categories.forEach(cat => {
        html += `<li><a href="#" onclick="showCategory('${cat.shortname}'); return false;">${cat.name}</a></li>`;
      });
      html += "</ul>";
      html += `<a href="#" onclick="showSpecials(); return false;">Specials</a>`;
      content.innerHTML = html;
    })
    .catch(showError);
}

// Показує товари однієї категорії
function showCategory(shortname) {
  loadJSON("data/" + shortname + ".json")
    .then(data => {
      let html = "<h2>" + data.name + "</h2>";
      data.items.forEach(item => {
        html += `
          <div class="item">
            <img src="https://placehold.co/200x200?text=${item.shortname}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p>${item.description}</p>
            <b>${item.price}</b>
          </div>`;
      });
      content.innerHTML = html;
    })
    .catch(showError);
}

// Випадкова категорія
function showSpecials() {
  loadJSON("data/categories.json")
    .then(categories => {
      const random = categories[Math.floor(Math.random() * categories.length)];
      showCategory(random.shortname);
    })
    .catch(showError);
}

showCatalog(true);
</script>
</body>
</html>
